/* ───────── database (Firebase Realtime Database REST) ───────── */
async function dbReq(method,path,body,query){
  const t=await Auth.token();
  const url=CFG.db+(path==='/'?'/':path)+'.json?auth='+encodeURIComponent(t)+(query?'&'+query:'');
  let r;try{r=await fetch(url,{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined})}
  catch(e){throw new Error('No connection. Try again.')}
  if(r.status===401||r.status===403)throw new Error('Not allowed. Sign in again.');
  if(!r.ok)throw new Error('Could not save ('+r.status+')');
  return r.json()}
/** One atomic multi-path write, e.g. {'jobs/ID/status':'ready','activity_logs/KEY':{...}} */
const commit=u=>dbReq('PATCH','/',u);
function logPath(u,jobId,action,description){
  u['activity_logs/'+pushId()]={jobId:jobId||null,action,description,role:S.role,timestamp:nowIso()}}

function openStream(path,query,onTree,onLive){
  let stop=false,ctrl=null,tree=null,backoff=1000;
  const setAt=(p,v)=>{const k=p.split('/').filter(Boolean);if(!k.length){tree=v&&typeof v==='object'?v:{};return}
    if(!tree)tree={};let o=tree;for(let i=0;i<k.length-1;i++){if(!o[k[i]]||typeof o[k[i]]!=='object')o[k[i]]={};o=o[k[i]]}
    if(v===null||v===undefined)delete o[k[k.length-1]];else o[k[k.length-1]]=v};
  function handle(block){let ev='',data='';
    block.split('\n').forEach(l=>{if(l.indexOf('event:')===0)ev=l.slice(6).trim();else if(l.indexOf('data:')===0)data+=l.slice(5).trim()});
    if(ev==='put'||ev==='patch'){let m;try{m=JSON.parse(data)}catch(e){return}
      if(ev==='put')setAt(m.path||'/',m.data);else for(const k in (m.data||{}))setAt((m.path==='/'?'':m.path||'')+'/'+k,m.data[k]);
      onTree(tree||{})}
    else if(ev==='auth_revoked'||ev==='cancel'){if(ctrl)ctrl.abort()}}
  async function run(){
    while(!stop){
      try{
        ctrl=new AbortController();
        const t=await Auth.token();
        const r=await fetch(CFG.db+path+'.json?auth='+encodeURIComponent(t)+(query?'&'+query:''),{headers:{Accept:'text/event-stream'},signal:ctrl.signal});
        if(!r.ok)throw new Error('http '+r.status);
        onLive(true);backoff=1000;tree=null;
        const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
        for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true}).replace(/\r\n/g,'\n');
          let i;while((i=buf.indexOf('\n\n'))>=0){const b=buf.slice(0,i);buf=buf.slice(i+2);handle(b)}}
      }catch(e){if(stop)return}
      if(stop)return;onLive(false);await sleep(backoff);backoff=Math.min(backoff*2,15000)}}
  run();
  return{close(){stop=true;if(ctrl)ctrl.abort()},reconnect(){if(ctrl)ctrl.abort()}}}

async function editAmount(j){
  const v=await dialog({title:(+j.estimatedCost||0)>0?'Edit amount':'Add amount',
    message:'Service charge only. Spare parts ('+inr(j.partsCost)+') are added automatically.',
    fields:[{name:'a',label:'Service charge (\u20B9)',type:'text',mode:'decimal',value:(+j.estimatedCost||0)>0?plain(j.estimatedCost):''}]});
  if(!v)return;const amt=num(v.a);
  if(!isFinite(amt)||amt<0){toast('Enter a valid amount',true);return}
  const nf2=amt+(+j.partsCost||0);
  if((+j.receivedAmount||0)>nf2+EPS&&!(await confirmBox('Customer already paid more','Received '+inr(j.receivedAmount)+' but the new bill is '+inr(nf2)+'. Save anyway?','Save anyway')))return;
  run(null,()=>{const u={};u['jobs/'+j.id+'/estimatedCost']=amt;u['jobs/'+j.id+'/finalCost']=nf2;u['jobs/'+j.id+'/updatedAt']=nowIso();

    s.appendChild(h('div',{class:'hist',text:parts.join('   \u00B7   ')+(j.paidAt?'\nLast payment: '+when(j.paidAt):''),style:'white-space:pre-line'}))}
  if(ps!=='paid'){
    let method='cash';
    const amt=h('input',{id:'payamt',type:'text',inputmode:'decimal',value:d>EPS?plain(d):'',placeholder:'Amount received'});
    const segC=h('button',{type:'button',class:'on',text:'Cash'}),segA=h('button',{type:'button',text:'Account (UPI)'});
    segC.onclick=()=>{method='cash';segC.className='on';segA.className=''};segA.onclick=()=>{method='account';segA.className='on';segC.className=''};
    const rec=h('button',{class:'btn pri',text:'Receive payment'});
    rec.onclick=()=>{const a=num(amt.value);
      if(!(a>0)){toast('Enter the amount received',true);return}
      if(a>d+EPS){toast('That is more than the balance due ('+inr(d)+')',true);return}
      run(rec,()=>{const full=(+j.finalCost||0)-((+j.receivedAmount||0)+a)<=EPS;
        const cash=(+j.cashReceived||0)+(method==='cash'?a:0),acc=(+j.accountReceived||0)+(method==='account'?a:0);
        const u={};const b='jobs/'+j.id+'/';
        u[b+(method==='cash'?'cashReceived':'accountReceived')]={'.sv':{increment:a}};
        u[b+'receivedAmount']={'.sv':{increment:a}};
        u[b+'paymentStatus']=full?'paid':'partial';u[b+'paymentMethod']=cash>0&&acc>0?'mixed':(cash>0?'cash':'account');
        u[b+'paidAt']=nowIso();u[b+'updatedAt']=nowIso();
        logPath(u,j.id,'payment_received','Received \u20B9'+plain(a)+' ('+(method==='cash'?'Cash':'Account')+')');return commit(u)},'Payment recorded')};
    s.appendChild(h('div',{style:'margin-top:12px'},h('label',{class:'f'},h('span',{text:'Amount (\u20B9)'}),amt),h('div',{class:'seg'},segC,segA),rec));
    if(ps!=='pending')s.appendChild(h('button',{class:'btn',style:'margin-top:8px',text:'Mark payment pending',
      onclick:e=>run(e.currentTarget,()=>{const u={};u['jobs/'+j.id+'/paymentStatus']='pending';u['jobs/'+j.id+'/updatedAt']=nowIso();
        logPath(u,j.id,'payment_pending','Payment marked pending (balance '+inr(d)+')');return commit(u)},'Marked as payment pending')}))}
  if(can.resetPay()&&((+j.receivedAmount||0)>0||ps==='pending'))
    s.appendChild(h('button',{class:'btn dan',style:'margin-top:8px',text:'Clear payments',onclick:async()=>{
      if(!(await confirmBox('Clear payments?','This removes every payment recorded on this job so you can enter it again. Use it only to fix a mistake.','Clear',true)))return;
      run(null,()=>{const u={};const b='jobs/'+j.id+'/';u[b+'cashReceived']=0;u[b+'accountReceived']=0;u[b+'receivedAmount']=0;u[b+'paymentStatus']='unpaid';
        u[b+'paymentMethod']=null;u[b+'paidAt']=null;u[b+'updatedAt']=nowIso();logPath(u,j.id,'payment_reset','Payments cleared (correction)');return commit(u)},'Payments cleared')}}));
  return s}

function lockSection(j){
  const has=!!(j.lockNote&&String(j.lockNote).trim()),fin=j.status==='delivered'||j.status==='return';
  const s=sec('Phone lock (PIN / passcode / pattern)');
  if(S.role==='Front Desk')s.appendChild(h('div',{class:'kv'},h('span',{text:has?'Saved \u2014 visible to Technician and Owner only':'Not added'})));
  else if(has)s.appendChild(h('div',{class:'lockv',onclick:()=>{lockShown=!lockShown;renderDetail(true)},
    text:lockShown?j.lockNote:'\u2022\u2022\u2022\u2022\u2022\u2022   tap to show'}));
  else s.appendChild(h('div',{class:'kv'},h('span',{text:fin?'Cleared when the job was finished':'Not added'})));
  if(!fin)s.appendChild(h('button',{class:'btn',style:'margin-top:8px',text:has?'Change lock note':'Add lock note',onclick:async()=>{
    const v=await dialog({title:'Phone lock note',message:'Deleted automatically when the job is Delivered or Returned.',
      fields:[{name:'n',area:true,ph:'e.g. PIN 4821, or Pattern: L shape from top-left',value:S.role!=='Front Desk'&&has?j.lockNote:''}],extra:has?'Remove':null});
    if(!v)return;const note=v.extra?'':String(v.n||'').trim();lockShown=false;
    run(null,()=>{const u={};u['jobs/'+j.id+'/lockNote']=note||null;u['jobs/'+j.id+'/updatedAt']=nowIso();
      logPath(u,j.id,'lock_note_changed',note?'Phone lock note updated':'Phone lock note removed');return commit(u)},note?'Lock note saved':'Lock note removed')}}));
  return s}

function partsSection(j,parts){
  const s=sec('Spare parts');
  if(!parts.length)s.appendChild(h('div',{class:'kv'},h('span',{text:'No parts added'})));
  const total=parts.reduce((a,p)=>a+(+p.cost||0)*(+p.quantity||1),0);
  parts.forEach(p=>s.appendChild(h('div',{class:'part'},h('span',{text:p.partName||'Part'}),h('b',{text:inr((+p.cost||0)*(+p.quantity||1))}),
    can.work()?h('button',{class:'x','aria-label':'Remove part',text:'\u00D7',onclick:()=>run(null,()=>{
      const t=total-(+p.cost||0)*(+p.quantity||1);const u={};u['parts/'+p.id]=null;
      u['jobs/'+j.id+'/partsCost']=t;u['jobs/'+j.id+'/finalCost']=(+j.estimatedCost||0)+t;u['jobs/'+j.id+'/updatedAt']=nowIso();
      logPath(u,j.id,'parts_updated','Part removed');return commit(u)})}):null)));
  if(can.work()){
    const nm=h('input',{id:'partname',type:'text',placeholder:'Part name',autocomplete:'off'});
    const ct=h('input',{id:'partcost',type:'text',inputmode:'decimal',placeholder:'Cost (\u20B9)'});
    const add=h('button',{class:'btn pri',style:'margin-top:4px',text:'Add part'});
    add.onclick=()=>{const name=nm.value.trim(),c=num(ct.value);
      if(!name||!(c>=0)){toast('Fill part name and cost',true);return}
      run(add,()=>{const t=total+c;const u={};const key=pushId();
        u['parts/'+key]={jobId:j.id,partName:name,cost:c,quantity:1,addedAt:nowIso()};
        u['jobs/'+j.id+'/partsCost']=t;u['jobs/'+j.id+'/finalCost']=(+j.estimatedCost||0)+t;u['jobs/'+j.id+'/updatedAt']=nowIso();
        logPath(u,j.id,'parts_updated','Part added: '+name+' \u20B9'+plain(c));return commit(u)},'Part added')};
    s.appendChild(h('div',{style:'margin-top:10px'},h('label',{class:'f'},h('span',{text:'New part'}),nm),h('label',{class:'f'},ct),add))}
  return s}

async function loadHistory(id,box){
  try{
    const data=await dbReq('GET','/activity_logs',undefined,'orderBy="$key"&limitToLast=300');
    const rows=Object.keys(data||{}).map(k=>data[k]).filter(x=>x&&x.jobId===id).sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp))).slice(0,15);
    box.textContent='';
    if(!rows.length){box.appendChild(h('div',{class:'hist',text:'No history yet'}));return}
    rows.forEach(r=>box.appendChild(h('div',{class:'hist'},h('b',{text:(r.role||'System')+': '}),r.description||r.action||'',h('div',{text:when(r.timestamp)}))))
  }catch(e){box.textContent='';box.appendChild(h('div',{class:'hist',text:'History unavailable'}))}}

async function deleteJob(j){
  if(!(await confirmBox('Delete job','Are you sure you want to delete this job? This cannot be undone.','Delete',true)))return;
  run(null,async()=>{const u={};u['jobs/'+j.id]=null;
    S.parts.filter(p=>p.jobId===j.id).forEach(p=>u['parts/'+p.id]=null);
    logPath(u,null,'deleted','Job '+j.id+' deleted');await commit(u);
    if(history.state&&history.state.sheet)history.back();else $$closeSheet();toast('Job deleted')})}

/* ───────── new job ───────── */
function openNew(){
  if(!can.create())return;
  const sh=openSheet('New job');const body=sh.body;
  let type='customer';const devs=[];const keys=[];let saving=false,batchId=null;
  const name=h('input',{type:'text',placeholder:'Customer name',autocomplete:'off',autocapitalize:'words'});
  const phone=h('input',{type:'tel',inputmode:'tel',placeholder:'Phone number',autocomplete:'off'});
  const dealer=h('input',{type:'text',placeholder:'Dealer / business name',autocomplete:'off',autocapitalize:'words'});
  const nameL=h('label',{class:'f'},h('span',{text:'Customer name *'}),name),dealL=h('label',{class:'f'},h('span',{text:'Dealer / business name *'}),dealer);
  const seg=h('div',{class:'seg'});const bC=h('button',{type:'button',class:'on',text:'Customer'}),bD=h('button',{type:'button',text:'Dealer'});seg.append(bC,bD);
  const recent=h('div',{class:'dchips'});
  const devBox=h('div');const addBtn=h('button',{class:'btn',type:'button',text:'+ Add another device',hidden:true});
  function drawRecent(){recent.textContent='';if(type!=='dealer')return;
    const seen={};S.jobs.forEach(j=>{if(j.customerType==='dealer'&&j.dealerName){const k=j.dealerName.toLowerCase()+'|'+(j.customerPhone||'');if(!seen[k]&&Object.keys(seen).length<8){seen[k]=1;
      recent.appendChild(h('button',{type:'button',class:'chip',text:j.dealerName,onclick:()=>{dealer.value=j.dealerName;phone.value=j.customerPhone||''}}))}}})}
  function setType(t){type=t;bC.className=t==='customer'?'on':'';bD.className=t==='dealer'?'on':'';nameL.hidden=t==='dealer';dealL.hidden=t==='customer';
    addBtn.hidden=t!=='dealer';if(t!=='dealer')while(devs.length>1)devs.pop().card.remove();drawRecent();num2()}
  bC.onclick=()=>setType('customer');bD.onclick=()=>setType('dealer');
  function num2(){devs.forEach((d,i)=>{d.title.textContent='Device '+(i+1);d.rm.hidden=devs.length<2})}
  function addDevice(){
    const f={brand:h('input',{type:'text',placeholder:'Brand (e.g. Samsung)',autocapitalize:'words'}),model:h('input',{type:'text',placeholder:'Model (e.g. A54)',autocapitalize:'words'}),
      imei:h('input',{type:'text',inputmode:'numeric',placeholder:'IMEI (optional)'}),fault:h('textarea',{rows:2,placeholder:'What is the problem?'}),
      cost:h('input',{type:'text',inputmode:'decimal',placeholder:'Estimated amount (\u20B9)'}),lock:h('textarea',{rows:2,placeholder:'e.g. PIN 4821 or Pattern: L shape'})};
    const title=h('span'),rm=h('button',{type:'button',class:'link',text:'Remove'});
    const card=h('div',{class:'dev-card'},h('h4',null,title,rm),
      h('label',{class:'f'},h('span',{text:'Brand *'}),f.brand),h('label',{class:'f'},h('span',{text:'Model *'}),f.model),h('label',{class:'f'},h('span',{text:'IMEI'}),f.imei),
      h('label',{class:'f'},h('span',{text:'Problem'}),f.fault),
      can.price()?h('label',{class:'f'},h('span',{text:'Estimated amount (\u20B9)'}),f.cost):null,
      h('label',{class:'f'},h('span',{text:'Phone lock note (PIN / passcode / pattern)'}),f.lock));
    const d={f,card,title,rm};rm.onclick=()=>{const i=devs.indexOf(d);devs.splice(i,1);keys.splice(i,1);card.remove();num2()};
    devs.push(d);keys.push(pushId());devBox.appendChild(card);num2()}
  addBtn.onclick=()=>addDevice();
  const save=h('button',{class:'btn pri',type:'button',text:'Save job'});
  save.onclick=async()=>{
    if(saving)return;
    const isD=type==='dealer';
    if(!isD&&!name.value.trim()){toast('Enter customer name',true);name.focus();return}
    if(isD&&!dealer.value.trim()){toast('Enter dealer / business name',true);dealer.focus();return}
    for(const d of devs){if(!d.f.brand.value.trim()){toast('Enter device brand',true);d.f.brand.focus();return}
      if(!d.f.model.value.trim()){toast('Enter device model',true);d.f.model.focus();return}}
    if(isD&&devs.length>1&&!batchId)batchId='batch_'+Date.now();
    saving=true;save.disabled=true;save.textContent='Saving…';
    try{
      const now=nowIso(),u={};
      devs.forEach((d,i)=>{const est=num(d.f.cost.value);const cost=isFinite(est)&&est>0?est:0;
        const job={id:keys[i],customerType:isD?'dealer':'customer',customerName:name.value.trim(),customerPhone:phone.value.trim(),dealerName:dealer.value.trim(),
          brand:d.f.brand.value.trim(),model:d.f.model.value.trim(),imei:d.f.imei.value.trim(),faultDescription:d.f.fault.value.trim(),
          estimatedCost:cost,partsCost:0,finalCost:cost,status:'pending',createdAt:now,updatedAt:now,createdByRole:S.role,
          paymentStatus:'unpaid',receivedAmount:0,cashReceived:0,accountReceived:0};
        if(isD&&devs.length>1)job.batchId=batchId;
        const ln=d.f.lock.value.trim();if(ln)job.lockNote=ln;
        u['jobs/'+keys[i]]=job;
        logPath(u,keys[i],'created','Job created for '+job.brand+' '+job.model+' ('+(isD?job.dealerName:job.customerName)+')')});
      await commit(u);
      toast(devs.length>1?devs.length+' jobs saved':'Job saved');
      if(history.state&&history.state.sheet)history.back();else $$closeSheet();
    }catch(e){toast(e.message||'Could not save',true);saving=false;save.disabled=false;save.textContent='Save job'}};
  body.append(h('div',{class:'sec'},seg,nameL,dealL,recent,h('label',{class:'f'},h('span',{text:'Phone'}),phone)),devBox,addBtn,h('div',{style:'height:12px'}),save);
  dealL.hidden=true;addDevice();setType('customer')}

/* ───────── boot ───────── */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Auth.user)S.streams.forEach(s=>s.reconnect())});
window.addEventListener('online',()=>{if(Auth.user)S.streams.forEach(s=>s.reconnect())});
(async function boot(){
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(await Auth.restore())startApp();else showLogin();
})();
</script>
</body>
